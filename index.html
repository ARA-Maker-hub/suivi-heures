    <label class="btn line pickl">Choisir une autre date<input type="date" id="cpick" aria-label="Date à copier"></label></div>
    <div class="sfoot"><button class="btn second" data-a="close">Annuler</button></div>`);
}

/* récapitulatif du mois (texte lisible) */
function recapText(y,mo){
  const n=new Date(y,mo+1,0).getDate(),first=new Date(y,mo,1),pf=db.settings.profile;
  const LB={matin:'Matin',apres:'Après-midi',nuit:'Nuit',nuit2:'Nuit (suite)',pause:'Pause',piq:'Piquet',piq2:'Piquet (suite)'};
  const DW=['Di','Lu','Ma','Me','Je','Ve','Sa'];
  const out=[`Suivi des heures · ${cap(dfmt(first,{month:'long',year:'numeric'}))}`];
  const who=[[pf.prenom,pf.nom].filter(Boolean).join(' '),pf.division].filter(Boolean).join(' · ');if(who)out.push(who);
  out.push('');
  let work=0,days=0,forf=0,piq=0;const ab={};
  for(let i=1;i<=n;i++){
    const d=new Date(y,mo,i),k=ymd(d),l=dayEntries(k);if(!l.length)continue;
    const t=totals(l),dd=db.days[k]||{};
    work+=t.work;piq+=t.piq;if(t.work>0)days++;if(dd.forfait)forf++;
    out.push(`${DW[d.getDay()]} ${pad(i)}.${pad(mo+1)}${t.work?'   Présence '+fmt(t.work):''}`);
    if(dd.forfait)out.push(`   Forfait : ${dd.lieu||''}`);
    for(const e of [...l.filter(x=>x.type!=='piquet'),...l.filter(x=>x.type==='piquet')]){
      if(e.type==='abs'){ab[e.absType]=(ab[e.absType]||0)+e.dur;out.push(`   Absence · ${e.absType} · ${fmt(e.dur)}`)}
      else out.push(`   ${e.start}–${e.end}  ${LB[e.blk]||'Travail'}${e.mandate&&e.type!=='pause'?' · '+e.mandate:''}`);
    }
    out.push('');
  }
  if(!days&&!piq&&!Object.keys(ab).length)return '';
  out.push('────────────────');
  out.push(`Présence : ${fmt(work)}`,`Jours travaillés : ${days}`,`Forfaits : ${forf}`);
  if(piq)out.push(`Piquet : ${fmt(piq)}`);
  for(const [k,v] of Object.entries(ab))out.push(`${k} : ${fmt(v)}`);
  out.push('','Relevé personnel, à titre de contrôle.');
  return out.join('\n');
}
function openRecap(){
  const txt=recapText(month.getFullYear(),month.getMonth());
  if(!txt){toast('Rien à exporter ce mois-ci');return}
  window._recap=txt;
  openSheet(`<h2>Récapitulatif du mois</h2><div class="sbody"><pre class="recap">${esc(txt)}</pre></div>
    <div class="sfoot"><button class="btn quiet" data-a="close" style="flex:none;padding:0 6px">Fermer</button><button class="btn second" data-a="recapcopy">Copier</button><button class="btn primary" data-a="recapshare">${I.save} Partager</button></div>`);
}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0;left:-999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return !!ok}catch(e){return false}
}

/* confirmation générique */
function ask(title,text,label,fn){
  window._ok=fn;
  openSheet(`<h2>${title}</h2><div class="sbody"><p style="color:var(--muted);line-height:1.5;margin:0">${text}</p></div>
  <div class="sfoot"><button class="btn second" data-a="close">Annuler</button><button class="btn primary" data-a="ok">${label}</button></div>`);
}

/* ---------- sauvegarde / export ---------- */
async function shareOrDownload(name,mime,content){
  const blob=new Blob([content],{type:mime});
  try{const file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true;
}
function b64enc(str){const by=new TextEncoder().encode(str);let b='';by.forEach(x=>b+=String.fromCharCode(x));return btoa(b)}
function b64dec(str){const b=atob(str);const by=Uint8Array.from(b,c=>c.charCodeAt(0));return new TextDecoder().decode(by)}
function backupMd(){
  const pf=db.settings.profile||{},who=[pf.prenom,pf.nom].filter(Boolean).join(' ');
  const mois=[...new Set(db.entries.map(e=>e.date.slice(0,7)))].sort();
  const out=[`# Mes heures, sauvegarde du ${dfmt(new Date(),{day:'numeric',month:'long',year:'numeric'})}`,''];
  if(who)out.push(who,'');
  out.push("Ce fichier vient de l'app Suivi des heures. Garde-le : dans l'app, le bouton « Retrouver mes heures » (Réglages) le relit et remet tes heures, par exemple après un changement de téléphone.",'');
  out.push(`${db.entries.length} plages enregistrées.`,'');
  for(const m of mois){const [y,mo]=m.split('-').map(Number);const t=recapText(y,mo-1);if(t){out.push('## '+cap(dfmt(new Date(y,mo-1,1),{month:'long',year:'numeric'})),'','```',t,'```','')}}
  out.push("## Données de l'app","","Ne modifie pas ce qui suit : c'est ce que l'app relit pour restaurer tes heures.","");
  out.push('<!--SUIVI-HEURES-DATA');
  const d=b64enc(JSON.stringify({v:1,saved:new Date().toISOString(),...db}));
  for(let i=0;i<d.length;i+=100)out.push(d.slice(i,i+100));
  out.push('SUIVI-HEURES-DATA-->','');
  return out.join('\n');
}
async function backup(){
  const name=`Mes heures ${pad(new Date().getDate())}.${pad(new Date().getMonth()+1)}.${new Date().getFullYear()}.md`;
  const ok=await shareOrDownload(name,'text/markdown',backupMd());
  if(ok){db.settings.lastBackup=Date.now();save();toast('Sauvegarde créée');if(tab==='set'||tab==='day')render()}
}
async function csv(){
  const rows=[['Date','Type','Début','Fin','Durée','Mandat ou absence','Forfait','Lieu']];
  const all=[...db.entries].sort((a,b)=>a.date.localeCompare(b.date)||toMin(a.start||'23:59')-toMin(b.start||'23:59'));
  for(const e of all){const dd=db.days[e.date]||{};
    rows.push([e.date,({matin:'Matin',apres:'Après-midi',nuit:'Nuit',nuit2:'Nuit',pause:'Pause',abs:'Absence',piq:'Piquet',piq2:'Piquet'}[e.blk]||'Travail'),e.start||'',e.end||'',toHHMM(dur(e)).replace(/^(\d\d):/,(m,h)=>`${+h}:`)
      ,e.type==='abs'?e.absType:(e.mandate||''),dd.forfait?'oui':'',dd.lieu||'']);}
  const txt='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  await shareOrDownload(`suivi-heures_${ymd(new Date())}.csv`,'text/csv',txt);
}
function restoreFile(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{let txt=String(r.result),d;
      const m=txt.match(/<!--SUIVI-HEURES-DATA\s*([\s\S]*?)\s*SUIVI-HEURES-DATA-->/);
      d=m?JSON.parse(b64dec(m[1].replace(/\s+/g,''))):JSON.parse(txt);
      if(!d||!Array.isArray(d.entries))throw 0;
      ask('Retrouver ces heures ?',`${d.entries.length} plages seront chargées et remplaceront les heures de cet appareil.`,'Retrouver',()=>{
        db={entries:d.entries,days:d.days||{},settings:Object.assign(db.settings,d.settings||{})};save();applyTheme();closeSheet();render();toast('Heures retrouvées')});
    }catch(e){toast("Ce fichier n'est pas une sauvegarde de l'app")}
  };r.readAsText(f);ev.target.value='';
}

/* ---------- clavier d'heure 24 h ---------- */
let PAD=null;
function openPad(title,init,cb){
  PAD={buf:(init||'').replace(':',''),fresh:!!init,cb,title};
  $('#pad').innerHTML=`<div class="grab"></div><h2>${title}</h2><div class="sbody"><div class="disp" id="disp"></div><div class="hint" id="phint" style="text-align:center"></div>
   <div class="quick">${quickTimes().map(q=>`<button data-q="${q.replace(':','')}">${q}</button>`).join('')}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
   <button class="fn" data-a="padnow">Maintenant</button><button data-k="0">0</button><button class="fn" data-k="b" aria-label="Effacer">⌫</button></div></div>
   <div class="sfoot"><button class="btn second" data-a="padclose">Annuler</button><button class="btn primary" data-k="ok">${I.check} OK</button></div>`;
  $('#padscrim').classList.add('on');$('#pad').classList.add('on');padDraw();
}
function padStr(){const b=PAD.buf.padStart(4,'0').slice(-4);return b.slice(0,2)+':'+b.slice(2)}
function padDraw(){$('#disp').textContent=padStr();$('#disp').style.opacity=PAD.fresh?.6:1;$('#phint').textContent=''}
function closePad(){$('#padscrim').classList.remove('on');$('#pad').classList.remove('on');PAD=null}
function padKey(k){
  if(!PAD)return;
  if(k==='ok'){const v=padStr(),h=+v.slice(0,2),m=+v.slice(3);
    if(h>23||m>59){$('#phint').textContent='Heure invalide : de 00:00 à 23:59.';const d=$('#disp');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');return}
    const cb=PAD.cb;closePad();cb(v);return}
  if(k==='b'){PAD.buf=PAD.fresh?'':PAD.buf.slice(0,-1);PAD.fresh=false}
  else{if(PAD.fresh){PAD.buf='';PAD.fresh=false}if(PAD.buf.length<4)PAD.buf+=k}
  padDraw();
}
$('#padscrim').onclick=closePad;

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.cell');if(!t)return;
  const a=t.dataset.a;
  if(t.dataset.k!==undefined){padKey(t.dataset.k);return}
  if(t.dataset.q&&PAD){PAD.buf=t.dataset.q;PAD.fresh=false;padKey('ok');return}
  if(t.dataset.t){tileTap(t.dataset.t);return}
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.edit){if((db.days[cur]||{}).closed){toast('Rouvre la journée pour modifier');return}const en=db.entries.find(x=>x.id===t.dataset.edit);if(en)openDay(en.src||en.date,TABOF[en.blk]);return}
  if(t.dataset.cp){closeSheet();openDay(cur,null,{copy:t.dataset.cp});return}
  if(t.dataset.go){cur=t.dataset.go;tab='day';render();return}
  if(t.dataset.theme){db.settings.theme=t.dataset.theme;save();applyTheme();render();return}
  if(t.dataset.dt){D.tab=t.dataset.dt;drawDay();return}
  if(t.dataset.now){const[b,i]=t.dataset.now.split(':');const n=new Date();D.segs[b][+i].end=toHHMM(n.getHours()*60+n.getMinutes());autoPause();drawDay();return}
  if(t.dataset.pd){if(!D.pause.start){$('#hint').textContent="Indique d'abord le début de la pause.";return}D.pause.end=toHHMM(toMin(D.pause.start)+Number(t.dataset.pd));D.pause.manual=true;drawDay();return}
  if(t.dataset.m!==undefined){const[b,i]=t.dataset.m.split(':');const g=D.segs[b][+i];g.mandate=g.mandate===t.dataset.v?'':t.dataset.v;drawPanel();return}
  if(t.dataset.abs){D.abs.absType=D.abs.absType===t.dataset.abs?'':t.dataset.abs;drawDay();return}
  if(t.dataset.d){D.abs.dur=D.abs.dur===Number(t.dataset.d)?0:Number(t.dataset.d);drawDay();return}
  if(t.dataset.rm){const[b,i]=t.dataset.rm.split(':');const L=D.segs[b];if(L.length>1)L.splice(+i,1);else L[0]={start:'',end:'',mandate:'',pre:false};autoPause();drawDay();return}
  if(t.dataset.addseg){const L=D.segs[t.dataset.addseg],last=L[L.length-1];L.push({start:last&&last.end?last.end:'',end:'',mandate:'',pre:!!(last&&last.end)});drawPanel();return}
  if(t.dataset.l!==undefined){D.lieu=D.lieu===t.dataset.l?'':t.dataset.l;drawPanel();return}
  switch(a){
    case 'prev':case 'next':{const d=parseYmd(cur);d.setDate(d.getDate()+(a==='next'?1:-1));cur=ymd(d);render();break}
    case 'mprev':month=new Date(month.getFullYear(),month.getMonth()-1,1);render();break;
    case 'mnext':month=new Date(month.getFullYear(),month.getMonth()+1,1);render();break;
    case 'theme':flipTheme();break;
    case 'settings':tab='set';render();break;
    case 'add':openDay(cur);break;
    case 'tpl':openDay(cur,null,{tpl:true});break;
    case 'tplfill':tplFill();D.tab='matin';drawDay();break;
    case 'copyday':openCopy();break;
    case 'bsnooze':{db.settings.backupSnooze=Date.now()+864e5;save();render();break}
    case 'snooze':{db.settings.installSnooze=Date.now()+864e5;save();render();break}
    case 'skipmiss':{(t.dataset.k2||'').split(',').filter(Boolean).forEach(k=>{db.days[k]=Object.assign(db.days[k]||{},{skip:true})});save();render();toast('Jours ignorés');break}
    case 'recap':openRecap();break;
    case 'recapshare':shareOrDownload(`suivi-heures_${month.getFullYear()}-${pad(month.getMonth()+1)}.txt`,'text/plain',window._recap);break;
    case 'recapcopy':copyText(window._recap).then(ok=>toast(ok?'Texte copié':'Copie impossible, utilise Partager'));break;
    case 'autopause':D.pause.manual=false;autoPause();drawDay();break;
    case 'nopause':D.pause={start:'',end:'',manual:true};drawDay();break;
    case 'noabs':D.abs={absType:'',dur:0};drawDay();break;
    case 'finish':openFinish();break;
    case 'reopen':db.days[cur]=Object.assign(db.days[cur]||{},{closed:false});save();render();toast('Journée rouverte');break;
    case 'close':closeSheet();break;
    case 'padclose':closePad();break;
    case 'padnow':PAD.buf=toHHMM(new Date().getHours()*60+new Date().getMinutes()).replace(':','');PAD.fresh=false;padDraw();break;
    case 'saveentry':saveDay();break;
    case 'delday':ask('Vider cette journée ?','Toutes les plages de ce jour seront supprimées. Cette action ne peut pas être annulée.','Vider',()=>{const d=D.date;db.entries=db.entries.filter(x=>x.date!==d&&x.src!==d);delete db.days[d];save();closeSheet();render();toast('Journée vidée')});break;
    case 'toggleforfait':D.forfait=!D.forfait;drawDay();break;
    case 'confirmfinish':confirmFinish();break;
    case 'ok':{const fn=window._ok;window._ok=null;if(fn)fn();break}
    case 'backup':backup();break;
    case 'csv':csv();break;
    case 'restore':$('#file').click();break;
    case 'install':{if(_ip){_ip.prompt();_ip=null}else if(navigator.share){navigator.share({title:'Suivi des heures',url:location.href.split('#')[0]}).catch(()=>{});toast("Choisis « Sur l'écran d'accueil »")}else toast("Utilise le menu du navigateur : Ajouter à l'écran d'accueil");break}
    case 'wipe':ask('Tout effacer ?','Toutes les heures de cet appareil seront supprimées. Une copie sauvegardée reste utilisable.','Effacer',()=>{db={entries:[],days:{},settings:db.settings};save();closeSheet();render();toast('Données effacées')});break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='cpick'&&e.target.value){
    const v=e.target.value;
    if(v===cur){toast('C\'est déjà le jour affiché');return}
    if(!hasDay(v)){toast('Rien à copier ce jour-là');return}
    closeSheet();openDay(cur,null,{copy:v});
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pf){db.settings.profile[t.dataset.pf]=t.value;save()}
  else if(t.dataset.mi){const[b,i]=t.dataset.mi.split(':');D.segs[b][+i].mandate=t.value;document.querySelectorAll('[data-m="'+b+':'+i+'"]').forEach(c=>c.setAttribute('aria-pressed','false'));validateDay()}
  else if(t.id==='fl'){D.lieu=t.value;document.querySelectorAll('[data-l]').forEach(c=>c.setAttribute('aria-pressed','false'));validateDay()}
});
document.addEventListener('keydown',e=>{
  if(PAD){if(/^\d$/.test(e.key))padKey(e.key);else if(e.key==='Backspace')padKey('b');else if(e.key==='Enter')padKey('ok');else if(e.key==='Escape')closePad();return}
  if(e.key==='Escape')closeSheet()});
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(db.settings.theme==='auto'){applyTheme();render()}});

applyTheme();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
