*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--work);outline-offset:2px}
#app{position:relative;z-index:2;max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(var(--dock,200px) + 16px)}
.dock{position:fixed!important}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);padding:5px 12px;border-radius:999px;font-weight:700;font-size:14px;margin-top:12px}
.empty{margin-top:22px;padding:26px 20px;border:2px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted);line-height:1.45}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:4px}
.note{margin-top:14px;padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--pause) 16%,transparent);display:flex;gap:12px;align-items:center;font-size:15px}
.note button{margin-left:auto;font-weight:700;color:var(--text);padding:10px 14px;border-radius:12px;background:var(--surface)}
.cell.out{visibility:hidden}
.bigf{}
/* ---- thèmes ---- */
:root[data-th=dark]{
  --bg:#080C0D;--bg2:#0E1517;--surface:#13191B;--surface2:#1B2427;--line:#222D30;--text:#F2F7F6;--muted:#8A9B98;
  --accent:#19E6B4;--on-accent:#04231C;--work:#19E6B4;--pause:#F2B84B;--abs:#8FA2F0;--piq:#E58BB4;
  --font:"Space Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;--on-work:#04231C;--ok:#19E6B4;--shadow:0 -10px 30px rgba(0,0,0,.45);--r:22px;--wave:rgba(255,255,255,.13);
}
:root[data-th=light]{
  --bg:#EEE9E1;--bg2:#E6DFD5;--surface:#F8F5F0;--surface2:#E3DBD0;--line:#D9D0C3;--text:#17120E;--muted:#706559;
  --accent:#E9653B;--on-accent:#FFFFFF;--work:#E9653B;--pause:#17120E;--abs:#7A5AF0;--piq:#C2477A;
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;--on-work:#FFFFFF;--ok:#C94E22;--shadow:0 -10px 30px rgba(90,55,20,.18);--r:24px;--wave:rgba(23,18,14,.11);
}

/* ---- fonds ---- */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:0}
.bg svg{position:absolute;left:-10%;top:-4%;width:120%;height:108%;opacity:0;stroke-width:1;fill:none}
.bg .dots{position:absolute;left:0;right:0;top:0;height:420px;opacity:0;
  background-image:radial-gradient(circle,var(--accent) 1px,transparent 1.7px);background-size:9px 9px;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 72% 0,#000 0,transparent 70%);mask-image:radial-gradient(ellipse 75% 70% at 72% 0,#000 0,transparent 70%)}
.bg .halo{position:absolute;left:-20%;right:-20%;top:-10%;height:55%;opacity:0}
:root[data-th=dark] .halo{background:radial-gradient(ellipse at 60% 0,rgba(25,230,180,.30),rgba(25,230,180,.06) 45%,transparent 70%)}
:root[data-th=light] .halo{background:radial-gradient(ellipse at 40% 0,rgba(233,101,59,.22),rgba(233,101,59,.05) 45%,transparent 70%)}
:root[data-bg=halo] .halo{opacity:1}
:root[data-bg=halo][data-th=dark] .dots{opacity:.55}
:root[data-bg=halo][data-th=light] .dots{opacity:.10}
:root[data-bg=ondes] .bg svg{opacity:1;stroke:var(--wave)}
:root[data-bg=ondes] .glow{opacity:1}
:root[data-th=dark] .g1{background:#1C3FD8;width:300px;height:300px;right:-130px;top:-80px}
:root[data-th=dark] .g2{background:#1FA866;width:300px;height:300px;left:-150px;bottom:-60px}
:root[data-th=dark] .g3{background:#B5652D;width:200px;height:200px;left:-110px;top:38%}
:root[data-th=dark][data-bg=ondes] .glow{opacity:.55}
:root[data-th=light] .g1{background:#9CC3FF;width:300px;height:300px;right:-130px;top:-80px}
:root[data-th=light] .g2{background:#A8E6B8;width:300px;height:300px;left:-150px;bottom:-60px}
:root[data-th=light] .g3{background:#FFB28F;width:200px;height:200px;left:-110px;top:38%}
:root[data-th=light][data-bg=ondes] .glow{opacity:.5}
@media (prefers-reduced-motion:no-preference){.bg svg{animation:drift 26s ease-in-out infinite alternate}}
@keyframes drift{from{transform:translateY(-10px)}to{transform:translateY(14px)}}

/* ---- app ---- */
.top{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.datebar{flex:1;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
:root[data-th=dark] .datebar{background:rgba(19,25,27,.75);backdrop-filter:blur(10px)}
.nav{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:22px}
.dl{flex:1;text-align:center;line-height:1.15;min-width:0}
.dl b{display:block;font-size:17px;font-weight:700;white-space:nowrap}
.dl small{color:var(--muted);font-size:13px}
.pod{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
:root[data-th=light] .pod{background:#17120E;color:#F8F5F0;border-color:#17120E}
.pod svg{width:24px;height:24px}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
:root[data-th=dark] .lbl.sl::before{content:"// ";color:var(--accent)}

/* sombre : héros texte */
.hero{padding:6px 4px 0}
.hero .lbl{color:var(--accent);font-size:15px;letter-spacing:.02em}
.big{font-size:84px;line-height:.98;font-weight:700;letter-spacing:-.045em;display:flex;align-items:baseline;gap:6px;margin-top:2px}
.big i{font-style:normal;font-size:26px;font-weight:500;color:var(--muted);letter-spacing:0}
.sub{display:flex;gap:22px;margin-top:12px;font-size:15px;color:var(--muted)}
.sub b{color:var(--text);font-weight:700}

/* clair : carte héros orange */
.herocard{background:var(--accent);color:#1A0E08;border-radius:30px;padding:20px 20px 16px;position:relative;box-shadow:0 18px 40px -18px rgba(233,101,59,.7)}
.herocard .lbl{color:rgba(26,14,8,.72);font-weight:600}
.herocard .big{font-size:46px;letter-spacing:-.035em;margin-top:2px}
.herocard .big i{font-size:19px;color:rgba(26,14,8,.7);font-weight:700}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;height:128px;margin-top:14px;padding-top:30px;position:relative}
.bar{flex:1;border-radius:12px;background:#17120E;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);position:relative}
.bar.sel{background:#F8F5F0;box-shadow:inset 0 0 0 2px #17120E}
.bar .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:#F8F5F0;color:#17120E;border-radius:14px;padding:6px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.bar .tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#F8F5F0}
.bar.ghost{height:10px!important;background:rgba(23,18,14,.35)}
.dow{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12px;font-weight:700;color:rgba(26,14,8,.72)}
.dow span{flex:1;text-align:center}
.herofoot{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;font-weight:600;color:rgba(26,14,8,.78)}
.herofoot b{color:#1A0E08}

/* ruban */
.ribbon{position:relative;height:64px;margin:20px 0 6px}
.rail{position:absolute;left:0;right:0;top:12px;height:32px;border-radius:12px;background:var(--surface2);overflow:hidden}
:root[data-th=dark] .rail{background:rgba(255,255,255,.06)}
.seg{position:absolute;top:0;bottom:0;border-radius:8px}
.seg.w{background:var(--work)}
:root[data-th=dark] .seg.w{box-shadow:0 0 18px rgba(25,230,180,.55)}
.seg.p{background:var(--pause)}
.ticks{position:absolute;left:0;right:0;top:48px;font-size:11px;color:var(--muted);height:14px}
.ticks i{position:absolute;transform:translateX(-50%);font-style:normal}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 4px;margin-top:14px}
.rcard .ribbon{margin:10px 0 2px}

/* lignes */
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:70px}
:root[data-th=dark] .row{background:rgba(19,25,27,.78);backdrop-filter:blur(8px)}
.row .mk{flex:none;width:6px;align-self:stretch;border-radius:6px;background:var(--c)}
.row .mk svg{display:none}
:root[data-th=light] .row .mk{width:44px;height:44px;align-self:center;border-radius:50%;background:var(--bg2);color:var(--c);display:grid;place-items:center}
:root[data-th=light] .row .mk svg{display:block;width:21px;height:21px}
.row .m{flex:1;min-width:0}
.row .t{font-weight:700;font-size:18px;letter-spacing:-.01em}
.row .s{color:var(--muted);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-weight:700;font-size:17px}
h3.sec{margin:22px 4px 0;font-size:15px;font-weight:500;color:var(--muted)}
:root[data-th=dark] h3.sec::before{content:"// ";color:var(--accent)}
.forfait{margin-top:12px;border:1.5px dashed var(--line);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.forfait b{font-size:16px}.forfait span{color:var(--muted);font-size:14px}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:5}
:root[data-th=dark] .dock{background:linear-gradient(to top,#080C0D 62%,rgba(8,12,13,0));padding-top:26px}
.dock .in{padding:0 16px calc(env(safe-area-inset-bottom) + 8px)}
.actions{display:flex;gap:10px}
.btn{height:60px;border-radius:999px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;white-space:nowrap}
.btn svg{width:23px;height:23px;stroke-width:2.4}
.btn.primary{flex:1.5;background:var(--accent);color:var(--on-accent)}
:root[data-th=dark] .btn.primary{background:var(--accent);box-shadow:0 0 34px rgba(25,230,180,.38),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.second{flex:1;background:var(--surface);border:1.5px solid var(--line)}
:root[data-th=dark] .btn.second{background:#171E20}
:root[data-th=light] .btn.second{background:#17120E;color:#F8F5F0;border-color:#17120E}
.tabs{display:flex;margin-top:8px}
.tab{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);border-radius:16px}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:var(--accent)}
:root[data-th=light] .dock .in{background:#17120E;border-radius:30px 30px 0 0;padding-top:12px}
:root[data-th=light] .tab{color:#9C9086}
:root[data-th=light] .tab[aria-selected=true]{color:var(--accent)}

/* aperçu mois : Bento */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes grow{from{transform:scaleY(.04)}}
@keyframes growx{from{transform:scaleX(.02)}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mhead h1{margin:0;font-size:24px;letter-spacing:-.02em}
.mhead .nav{width:50px;height:50px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.bento{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.bn{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:16px;min-width:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
:root[data-th=dark] .bn{background:rgba(19,25,27,.78);backdrop-filter:blur(8px)}
.bn.w2{grid-column:1/-1}
.bn .k{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;font-size:13px}
.bn .k i{width:9px;height:9px;border-radius:50%;background:var(--work);flex:none}
:root[data-th=dark] .bn .k i{box-shadow:0 0 10px var(--work)}
.bn .num{font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.035em;margin-top:8px}
.bn .num span{font-size:17px;font-weight:500;color:var(--muted);letter-spacing:0;margin:0 2px 0 3px}
.bn .sub2{margin-top:4px;color:var(--muted);font-size:13px;font-weight:500}
.bn.hero{padding:18px 18px 14px}
:root[data-th=dark] .bn.hero{background:linear-gradient(160deg,rgba(25,230,180,.20),rgba(19,25,27,.86) 58%);border-color:rgba(25,230,180,.35)}
:root[data-th=light] .bn.hero{background:var(--accent);border-color:transparent;color:#1A0E08;box-shadow:0 18px 40px -18px rgba(233,101,59,.7)}
:root[data-th=light] .bn.hero .k,:root[data-th=light] .bn.hero .num span,:root[data-th=light] .bn.hero .sparkl{color:rgba(26,14,8,.72)}
:root[data-th=light] .bn.hero .k i{background:#1A0E08}
.bn.hero .num{font-size:60px;margin-top:6px}
.bn.hero .num span{font-size:22px}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:14px}
.spark i{flex:1;min-width:0;border-radius:4px 4px 2px 2px;background:var(--work);height:var(--h);transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*14ms + 150ms)}
:root[data-th=dark] .spark i{box-shadow:0 0 10px rgba(25,230,180,.4)}
:root[data-th=light] .spark i{background:#17120E}
.spark i.z{height:4px;background:rgba(255,255,255,.14);box-shadow:none}
:root[data-th=light] .spark i.z{background:rgba(23,18,14,.28)}
.spark i.today{outline:2px solid var(--text);outline-offset:1px}
:root[data-th=light] .spark i.today{outline-color:#F8F5F0}
.sparkl{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:600;color:var(--muted)}
.bn.piq .k i{background:var(--piq)}
.bn.row2{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bn.row2 .num{margin:0;font-size:30px;color:var(--piq)}
.bn .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.bn .cal .h{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cell{aspect-ratio:1/1.08;border-radius:12px;background:var(--bg);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative}
:root[data-th=dark] .cell{background:rgba(255,255,255,.04)}
.cell small{font-size:10px;color:var(--muted);font-weight:600;min-height:12px}
.cell.has{background:color-mix(in srgb,var(--work) var(--p,20%),var(--bg))}
.cell.has small{color:var(--text);opacity:.75}
.cell.today{outline:2.5px solid var(--accent);outline-offset:-1px}
.cell.o{visibility:hidden}.cell.we{color:var(--muted)}
.cell .tick{position:absolute;top:4px;right:4px;width:10px;height:10px;color:var(--accent)}
:root[data-th=light] .cell .tick{color:#17120E}
.week2{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.week2:first-child{border-top:0}
.week2 b{font-size:15px}.week2 small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.week2 .bar{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden}
:root[data-th=dark] .week2 .bar{background:rgba(255,255,255,.07)}
.week2 .bar i{display:block;height:100%;border-radius:6px;background:var(--work);width:var(--w);transform-origin:left;animation:growx .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*70ms + 300ms)}
.week2 em{font-style:normal;font-weight:700;font-size:16px}
@media (prefers-reduced-motion:reduce){.bn,.spark i,.week2 .bar i{animation:none!important}}

/* ===== Liquid Glass + dégradés 3D (réglage « Effet ») ===== */
:root[data-fx=glass][data-th=dark]{
  --g-bg:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.035) 55%,rgba(255,255,255,.08)),linear-gradient(rgba(9,14,15,.46),rgba(9,14,15,.46));
  --g-bd:rgba(255,255,255,.17);
  --g-sh:inset 0 1px 0 rgba(255,255,255,.40),inset 0 -1px 0 rgba(255,255,255,.05),inset 1px 0 0 rgba(255,255,255,.07),0 14px 34px -10px rgba(0,0,0,.6);
  --sheen:rgba(255,255,255,.20);
}
:root[data-fx=glass][data-th=light]{
  --g-bg:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.40) 55%,rgba(255,255,255,.60));
  --g-bd:rgba(255,255,255,.9);
  --g-sh:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.5),0 16px 32px -14px rgba(90,55,20,.32);
  --sheen:rgba(255,255,255,.65);
}
:root[data-fx=glass] .datebar,:root[data-fx=glass] .row,:root[data-fx=glass] .forfait,:root[data-fx=glass] .rcard,
:root[data-fx=glass] .bn,:root[data-fx=glass] .mhead .nav,:root[data-fx=glass] .btn.second,:root[data-fx=glass] .pod{
  background:var(--g-bg);border:1px solid var(--g-bd);box-shadow:var(--g-sh);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);position:relative;
}
:root[data-fx=glass] .forfait{border-style:solid}
/* reflet spéculaire en haut à gauche */
:root[data-fx=glass] .datebar::before,:root[data-fx=glass] .row::before,:root[data-fx=glass] .bn::before,
:root[data-fx=glass] .forfait::before,:root[data-fx=glass] .rcard::before,:root[data-fx=glass] .btn.second::before,:root[data-fx=glass] .pod::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(118deg,var(--sheen) 0%,rgba(255,255,255,0) 34%);
}
:root[data-fx=glass] .row>*,:root[data-fx=glass] .bn>*,:root[data-fx=glass] .datebar>*{position:relative}
:root[data-fx=glass] .row{border-radius:26px}
/* pastille Réglages : verre sombre en clair */
:root[data-fx=glass][data-th=light] .pod{background:linear-gradient(160deg,#4A4038,#17120E 70%);border-color:rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 22px -8px rgba(0,0,0,.55);color:#F8F5F0}
:root[data-fx=glass][data-th=light] .pod::before{background:linear-gradient(150deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%)}

/* cartes héros : volume + gloss */
:root[data-fx=glass][data-th=light] .herocard,:root[data-fx=glass][data-th=light] .bn.hero{
  background:linear-gradient(165deg,#FF9A6E 0%,#EE6A3F 40%,#D24C1E 100%);border:1px solid rgba(255,255,255,.45);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -26px 38px rgba(120,30,0,.30),0 26px 46px -16px rgba(205,72,22,.8);
}
:root[data-fx=glass][data-th=dark] .bn.hero{
  background:radial-gradient(120% 95% at 12% 0%,rgba(90,255,222,.46),rgba(25,230,180,.12) 46%,rgba(6,38,34,.62) 100%);border:1px solid rgba(130,255,228,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -26px 40px rgba(0,0,0,.30),0 24px 50px -16px rgba(25,230,180,.6);
}
:root[data-fx=glass] .herocard::before,:root[data-fx=glass] .bn.hero::before{
  content:"";position:absolute;left:0;right:0;top:0;height:48%;border-radius:inherit;pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,.30),rgba(255,255,255,0));
}
:root[data-fx=glass] .herocard{position:relative}
:root[data-fx=glass] .herocard>*{position:relative}

:root[data-fx=glass][data-th=dark] .bn.hero .k{color:rgba(242,247,246,.85)}
/* boutons en relief */
:root[data-fx=glass][data-th=dark] .btn.primary{
  background:linear-gradient(180deg,#6BFFDC 0%,#19E6B4 48%,#0DB48B 100%);color:#03231B;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -4px 8px rgba(0,70,52,.4),0 0 36px rgba(25,230,180,.5),0 12px 22px -8px rgba(0,0,0,.65)}
:root[data-fx=glass][data-th=light] .btn.primary{
  background:linear-gradient(180deg,#FF9366 0%,#E9653B 50%,#CC4A1E 100%);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -4px 8px rgba(110,25,0,.4),0 12px 22px -8px rgba(0,0,0,.6)}
:root[data-fx=glass][data-th=light] .btn.second{background:linear-gradient(180deg,#4A4038,#17120E 75%);border-color:rgba(255,255,255,.22);color:#F8F5F0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 22px -10px rgba(0,0,0,.6)}
:root[data-fx=glass][data-th=light] .btn.second::before{background:linear-gradient(to bottom,rgba(255,255,255,.22),rgba(255,255,255,0) 55%)}

/* barre du bas : verre flottant */
:root[data-fx=glass] .dock{background:linear-gradient(to top,var(--bg) 22%,transparent)!important;padding-top:34px}
:root[data-fx=glass] .dock .in{margin:0 10px calc(env(safe-area-inset-bottom) + 8px);padding:12px 12px 6px;border-radius:36px;
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%)}
:root[data-fx=glass][data-th=dark] .dock .in{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 60%,rgba(255,255,255,.07)),rgba(10,16,17,.55);
  border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 18px 40px -8px rgba(0,0,0,.75)}
:root[data-fx=glass][data-th=light] .dock .in{background:linear-gradient(145deg,rgba(60,48,40,.78),rgba(23,18,14,.86));
  border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 36px -10px rgba(40,20,5,.6)}

/* ruban et barres : dégradés volumineux */
:root[data-fx=glass] .rail{box-shadow:inset 0 2px 7px rgba(0,0,0,.38),inset 0 -1px 0 rgba(255,255,255,.08)}
:root[data-fx=glass][data-th=dark] .seg.w{background:linear-gradient(180deg,#7CFFE3,#19E6B4 52%,#0DA37F);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 20px rgba(25,230,180,.6)}
:root[data-fx=glass][data-th=dark] .seg.p{background:linear-gradient(180deg,#FFD683,#F2B84B 52%,#C98F22);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
:root[data-fx=glass][data-th=light] .seg.w{background:linear-gradient(180deg,#FF9A6E,#E9653B 52%,#C54716);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
:root[data-fx=glass][data-th=light] .seg.p{background:linear-gradient(180deg,#4A4038,#17120E);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
:root[data-fx=glass][data-th=light] .bar{background:linear-gradient(180deg,#52483F,#17120E 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 12px -6px rgba(0,0,0,.55)}
:root[data-fx=glass][data-th=light] .bar.sel{background:linear-gradient(180deg,#FFFFFF,#EADFD2);box-shadow:inset 0 0 0 2px #17120E,0 8px 12px -6px rgba(0,0,0,.45)}
:root[data-fx=glass][data-th=dark] .spark i{background:linear-gradient(180deg,#8CFFE6,#19E6B4 55%,#0DA37F);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 0 12px rgba(25,230,180,.5)}
:root[data-fx=glass][data-th=light] .spark i{background:linear-gradient(180deg,#52483F,#17120E 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
:root[data-fx=glass] .spark i.z{background:rgba(255,255,255,.14);box-shadow:none}
:root[data-fx=glass][data-th=light] .spark i.z{background:rgba(23,18,14,.28)}
:root[data-fx=glass][data-th=dark] .week2 .bar i{background:linear-gradient(180deg,#8CFFE6,#19E6B4 55%,#0DA37F);box-shadow:0 0 10px rgba(25,230,180,.5)}
:root[data-fx=glass][data-th=light] .week2 .bar i{background:linear-gradient(180deg,#FF9A6E,#E9653B 55%,#C54716)}
:root[data-fx=glass] .row .mk{box-shadow:0 0 12px color-mix(in srgb,var(--c) 55%,transparent)}
:root[data-fx=glass] .cell{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
:root[data-fx=glass][data-th=light] .cell{background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(255,255,255,.35));box-shadow:inset 0 1px 0 #fff}
:root[data-fx=glass] .cell.has{background:linear-gradient(145deg,color-mix(in srgb,var(--work) calc(var(--p,20%) + 14%),transparent),color-mix(in srgb,var(--work) var(--p,20%),transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
:root[data-fx=glass] .tab[aria-selected=true]{text-shadow:0 0 14px color-mix(in srgb,var(--accent) 60%,transparent)}

/* halos de couleur : visibles derrière le verre, même sur fond uni/halo */
:root[data-fx=glass][data-bg=uni] .glow,:root[data-fx=glass][data-bg=halo] .glow{opacity:.45}
:root[data-fx=glass][data-th=dark][data-bg=ondes] .glow{opacity:.75}
:root[data-fx=glass][data-th=light][data-bg=ondes] .glow{opacity:.65}
@media (prefers-reduced-motion:no-preference){:root[data-fx=glass] .glow{animation:orb 22s ease-in-out infinite alternate}:root[data-fx=glass] .g2{animation-duration:28s}}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(26px,-34px)}}

/* ===== Relief renforcé ===== */
:root[data-fx=glass][data-th=dark]{--rl:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.05),0 1px 1px rgba(0,0,0,.35),0 10px 18px -6px rgba(0,0,0,.6),0 30px 46px -20px rgba(0,0,0,.7);--ring1:rgba(255,255,255,.55);--ring2:rgba(255,255,255,.22)}
:root[data-fx=glass][data-th=light]{--rl:inset 0 2px 0 #fff,inset 0 -3px 7px rgba(150,105,65,.20),0 1px 1px rgba(90,55,20,.18),0 12px 20px -8px rgba(90,55,20,.32),0 32px 48px -22px rgba(90,55,20,.38);--ring1:rgba(255,255,255,.95);--ring2:rgba(255,255,255,.5)}
:root[data-fx=glass] .datebar,:root[data-fx=glass] .row,:root[data-fx=glass] .forfait,:root[data-fx=glass] .rcard,
:root[data-fx=glass] .bn:not(.hero),:root[data-fx=glass] .mhead .nav{box-shadow:var(--rl)}
/* liseré de verre biseauté (bord qui capte la lumière) */
:root[data-fx=glass] .datebar::after,:root[data-fx=glass] .row::after,:root[data-fx=glass] .bn::after,:root[data-fx=glass] .forfait::after,
:root[data-fx=glass] .rcard::after,:root[data-fx=glass] .btn.second::after,:root[data-fx=glass] .pod::after,:root[data-fx=glass] .herocard::after,
:root[data-fx=glass] .dock .in::after,:root[data-fx=glass] .mhead .nav::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(135deg,var(--ring1),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 66%,var(--ring2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
:root[data-fx=glass] .mhead .nav,:root[data-fx=glass] .dock .in{position:relative}
/* reflet courbe plus marqué sur les héros */
:root[data-fx=glass] .herocard::before,:root[data-fx=glass] .bn.hero::before{height:62%;
  background:radial-gradient(120% 78% at 22% -12%,rgba(255,255,255,.58),rgba(255,255,255,.12) 52%,rgba(255,255,255,0) 70%)}
:root[data-fx=glass][data-th=light] .herocard,:root[data-fx=glass][data-th=light] .bn.hero{
  box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -34px 44px rgba(120,30,0,.38),inset 0 0 0 1px rgba(255,255,255,.2),0 2px 2px rgba(120,30,0,.3),0 18px 26px -10px rgba(205,72,22,.7),0 40px 60px -20px rgba(205,72,22,.75)}
:root[data-fx=glass][data-th=dark] .bn.hero{
  box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -34px 50px rgba(0,0,0,.4),inset 0 0 0 1px rgba(160,255,235,.14),0 2px 2px rgba(0,0,0,.4),0 18px 28px -10px rgba(25,230,180,.55),0 40px 60px -22px rgba(25,230,180,.55)}
/* boutons : touche en relief, elle s'enfonce au toucher */
:root[data-fx=glass][data-th=dark] .btn.primary{
  background:radial-gradient(130% 90% at 50% -10%,rgba(255,255,255,.6),rgba(255,255,255,0) 58%),linear-gradient(180deg,#6BFFDC 0%,#19E6B4 46%,#0AA07C 100%);

/* feuille */
.scrim{position:fixed;inset:0;background:rgba(5,10,12,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:92%;display:flex;flex-direction:column;
  background:var(--bg);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 2px}
.sheet h2{margin:6px 20px 10px;font-size:22px}
.sbody{overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;-webkit-overflow-scrolling:touch}
.sfoot{display:flex;gap:10px;padding:12px 20px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line)}
.seg3{display:flex;background:var(--surface2);border-radius:16px;padding:4px;gap:4px}
.seg3 button{flex:1;height:52px;border-radius:12px;font-weight:700;font-size:16px;color:var(--muted)}
.seg3 button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg3 button[aria-pressed=true].k-work{color:var(--work)}
.seg3 button[aria-pressed=true].k-pause{color:var(--pause)}
.seg3 button[aria-pressed=true].k-abs{color:var(--abs)}
label.f{display:block;margin-top:18px;font-size:14px;font-weight:700;color:var(--muted)}
.times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:8px}
@media (pointer:coarse){input[type=time]::-webkit-calendar-picker-indicator{display:none}}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px 12px;display:block;width:100%;text-align:left;min-width:0}
.tile span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
.tile b{display:block;font-size:34px;font-weight:800;line-height:46px;height:46px;letter-spacing:-.01em}
.tile.empty b{color:var(--line)}
.tile:active{border-color:var(--work)}
#pad{z-index:60}.padscrim{z-index:55}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.quick button{height:48px;border-radius:14px;background:color-mix(in srgb,var(--work) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--work) 42%,var(--line));font-weight:800;font-size:17px;color:var(--text)}
.quick button:active{background:color-mix(in srgb,var(--work) 30%,var(--surface))}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-height:720px){.disp{font-size:46px;padding:0}.pad{gap:8px}.pad button{height:54px;font-size:24px}.quick button{height:42px}.quick{margin-top:6px}}
.pad button{height:66px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-size:28px;font-weight:700}
.pad button:active{background:var(--surface2)}
.pad .fn{font-size:18px;color:var(--muted)}
.disp{font-size:64px;font-weight:800;text-align:center;letter-spacing:-.02em;padding:8px 0 0}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .25s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:48px;padding:0 18px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:16px}
.chip[aria-pressed=true]{background:var(--work);border-color:var(--work);color:var(--on-work)}
.chip.abs[aria-pressed=true]{background:var(--abs);border-color:var(--abs);color:#fff}
.chip.pause[aria-pressed=true]{background:var(--pause);border-color:var(--pause);color:#2b1c00}
.txt{width:100%;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:18px;margin-top:8px}
.txt:focus{border-color:var(--work);outline:none}
.hint{margin-top:12px;font-size:14px;color:var(--pause);font-weight:600;min-height:20px}
.link{color:var(--work);font-weight:800;font-size:15px;padding:10px 6px}
.del{color:var(--muted);font-weight:700;padding:0 8px}
.stabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:4px 20px 10px}
.stabs::-webkit-scrollbar{display:none}
.stab{height:48px;padding:0 6px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:16px;color:var(--muted);position:relative;white-space:nowrap}
.stab[aria-selected=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14),inset 0 0 0 1.5px var(--work)}
.stab.k-pause[aria-selected=true]{box-shadow:0 1px 4px rgba(0,0,0,.14),inset 0 0 0 1.5px var(--pause)}
.stab.k-abs[aria-selected=true]{box-shadow:0 1px 4px rgba(0,0,0,.14),inset 0 0 0 1.5px var(--abs)}
.stab.k-piq[aria-selected=true]{box-shadow:0 1px 4px rgba(0,0,0,.14),inset 0 0 0 1.5px var(--piq)}
.stab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--work);margin-left:8px;vertical-align:middle}
.stab.k-pause .dot{background:var(--pause)}.stab.k-abs .dot{background:var(--abs)}.stab.k-piq .dot{background:var(--piq)}
.plage{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 14px 16px;margin-top:10px}
.plage .ph{display:flex;justify-content:space-between;align-items:center;min-height:30px}
.plage .ph b{font-size:17px}
.plage .tile{background:var(--bg)}
.plage .txt{background:var(--bg)}
.plage .btn{height:52px;font-size:16px;width:100%;margin-top:10px}
.rm{color:var(--muted)!important;font-weight:700!important}
.addseg{height:52px;font-size:16px;width:100%;margin-top:10px;background:none;border:1.5px dashed var(--line);color:var(--muted);flex:none}
.hint.ok2{color:var(--muted);font-weight:500;min-height:0}

/* récap terminer */
.bigf{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bigf span{font-size:20px;color:var(--muted);font-weight:600}
.mrow{margin-top:14px}
.mrow .h{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.mrow .h em{font-style:normal;color:var(--muted)}
.mbar{height:10px;border-radius:8px;background:var(--surface2);margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--work);border-radius:8px}
.switch{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:20px;width:100%;text-align:left}
.switch b{display:block;font-size:17px}.switch small{color:var(--muted);font-size:14px}
.sw{width:56px;height:34px;border-radius:20px;background:var(--surface2);position:relative;flex:none;border:1.5px solid var(--line);transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked=true] .sw{background:var(--work);border-color:var(--work)}
.switch[aria-checked=true] .sw::after{transform:translateX(22px);background:var(--on-work)}
.done{text-align:center;padding:18px 0 6px}
.done .ring{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.done .ring svg{width:44px;height:44px;stroke-width:2.6}
.done h2{margin:0 0 6px}.done p{margin:0;color:var(--muted);line-height:1.45}

/* réglages */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card h4{margin:0 0 4px;font-size:17px}
.card p{margin:0 0 12px;color:var(--muted);font-size:14.5px;line-height:1.45}
.card .btn{height:54px;font-size:16px;width:100%;margin-top:8px}
.btn.line{background:var(--surface2);flex:none}
.btn.quiet{background:none;color:var(--muted);height:48px}
.toast{position:fixed;left:50%;bottom:calc(var(--dock,200px) + 14px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:13px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cell.miss::after{content:"";position:absolute;top:7px;left:8px;width:7px;height:7px;border-radius:50%;background:var(--pause)}
.note.col{flex-direction:column;align-items:stretch;gap:10px}
.note.col{padding:12px 14px;gap:8px;margin-top:0;margin-bottom:6px}
.note.col .chips{margin-top:0;align-items:center}
.note.col .chip{min-height:40px;padding:0 14px;font-size:15px}
.note.col .link{margin-left:auto;padding:8px 4px;color:var(--muted)}
.empty .btn{width:100%;margin-top:12px;height:56px;font-size:17px}
.empty .btn.primary{flex:none}
.empty .btn{height:auto;min-height:56px;padding:10px 20px}
.empty .btn small{font-weight:600;opacity:.8;font-size:14px}
pre.recap{white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0;color:var(--text);max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch}
.pickl{position:relative;overflow:hidden;margin-top:12px;width:100%}
.pickl input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root[data-th=light] .tab{color:#D2C5B8}
.tab{font-size:13px}
.bn .cal{gap:3px}
.btn[disabled]{opacity:1;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05))!important;color:var(--muted)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)!important;text-shadow:none!important;filter:none}
.btn[disabled]::before,.btn[disabled]::after{opacity:.25}
:root[data-th=light] .btn[disabled]{background:linear-gradient(180deg,#E3DBD2,#D6CCC1)!important;color:#8B8076!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)!important}

:root[data-th=light] .stab.k-pause[aria-selected=true]{box-shadow:0 1px 4px rgba(0,0,0,.14),inset 0 0 0 1.5px #17120E}

:root[data-th=light] .herocard ~ .badge{margin-top:12px}

:root[data-th=dark] .note{border:1px solid rgba(242,184,75,.3)}

:root[data-th=light] .pad button{box-shadow:inset 0 2px 0 #fff,0 5px 0 rgba(120,85,50,.25),0 10px 14px -8px rgba(90,55,20,.4)}
.pad button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 rgba(0,0,0,.3)}
.quick button{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 4px 0 color-mix(in srgb,var(--work) 40%,#000)}
.toast{background:rgba(10,16,18,.86);color:#F2F7F6;border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
:root[data-th=light] .toast{background:rgba(23,18,14,.88)}
.sw{box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="halo"></div><div class="dots"></div><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>
<div id="app"></div>
<div class="dock" id="dock"><div class="in">
  <div class="actions" id="actions"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="scrim padscrim" id="padscrim"></div>
<div class="sheet" id="pad" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toHHMM=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const fmt=m=>`${Math.floor(m/60)} h ${pad(m%60)}`;
const span=(s,e)=>{let d=toMin(e)-toMin(s);if(d<=0)d+=1440;return d};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dfmt=(d,o)=>new Intl.DateTimeFormat('fr-CH',o).format(d);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ABS=['Compensation','Vacances','Jour férié','Maladie','Autre'];

/* ---------- données (locales à l'appareil) ---------- */
const KEY='suivi-heures-v1';
let mem=null;
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.entries))return d}}catch(e){}
  return mem||{entries:[],days:{},settings:{theme:'auto',fullDay:492,lastBackup:null}};
}
let db=load();
db.settings=Object.assign({theme:'auto',fullDay:492,lastBackup:null},db.settings||{});
db.days=db.days||{};
db.settings.profile=Object.assign({nom:'',prenom:'',division:''},db.settings.profile||{});
db.settings.tpl=Object.assign({m1:'07:00',m2:'12:00',a1:'13:00',a2:'16:12'},db.settings.tpl||{});
for(const e of db.entries)if(!e.blk)e.blk=e.type==='pause'?'pause':e.type==='abs'?'abs':(toMin(e.start)<720?'matin':'apres');
function save(){
  mem=db;
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Enregistrement impossible sur cet appareil")}
}
const dur=e=>e.type==='abs'?e.dur:span(e.start,e.end);
const dayEntries=d=>db.entries.filter(e=>e.date===d).sort((a,b)=>(a.type==='abs')-(b.type==='abs')||toMin(a.start||'23:59')-toMin(b.start||'23:59'));
function totals(list){
  const t={work:0,pause:0,abs:0,piq:0,by:{}};
  for(const e of list){const m=dur(e);
    if(e.type==='work'){t.work+=m;t.by[e.mandate]=(t.by[e.mandate]||0)+m}
    else if(e.type==='pause')t.pause+=m;else if(e.type==='piquet')t.piq+=m;else t.abs+=m}
  return t;
}
function recents(key){
  const seen=[],src=key==='mandate'?db.entries.filter(e=>e.type==='work').map(e=>e.mandate)
    :Object.values(db.days).map(d=>d.lieu);
  for(let i=src.length-1;i>=0;i--){const v=src[i];if(v&&v!=='Non productif'&&!seen.includes(v))seen.push(v)}
  return seen.slice(0,5);
}

const hasDay=k=>db.entries.some(e=>e.date===k&&e.blk!=='nuit2'&&e.blk!=='piq2');
function lastMandate(){
  let best=null;
  for(const e of db.entries)if(e.type==='work'&&e.mandate&&(!best||e.date>=best.date))best=e;
  return best?best.mandate:'';
}
const quickTimes=()=>{const t=db.settings.tpl;return [t.m1,t.m2,t.a1,t.a2]};
/* jours de semaine sans saisie (depuis le premier jour noté) */
function firstDate(){let f=null;for(const e of db.entries)if(!f||e.date<f)f=e.date;return f}
function isMissing(k){
  const f=firstDate();if(!f||k<f||k>=ymd(new Date()))return false;
  const wd=parseYmd(k).getDay();if(wd===0||wd===6)return false;
  if((db.days[k]||{}).skip)return false;
  return !db.entries.some(e=>e.date===k);
}
function missingList(){
  const out=[],now=new Date();
  for(let i=1;i<=10;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const k=ymd(d);if(k!==cur&&isMissing(k))out.push(k)}
  return out.reverse();
}
const isInstalled=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function installHTML(){
  if(isInstalled())return '';
  const sn=db.settings.installSnooze;if(sn&&Date.now()<sn)return '';
  return `<div class="note col"><span><b>Installe l'app pour protéger tes heures</b><br><small>Sans installation, ton téléphone peut effacer tes données au bout de quelques jours.</small></span><div class="chips"><button class="btn primary" data-a="install" style="min-height:48px;padding:0 20px">Installer</button><button class="link" data-a="snooze">Plus tard</button></div></div>`;
}
function missingHTML(){
  const L=missingList();if(!L.length)return '';
  const yest=ymd(new Date(Date.now()-864e5));
  const txt=L.length===1?(L[0]===yest?"Hier n'est pas noté":'1 jour sans saisie'):`${L.length} jours sans saisie`;
  return `<div class="note col"><span><b>${txt}</b></span><div class="chips">${L.map(k=>`<button class="chip" data-go="${k}">${esc(dfmt(parseYmd(k),{weekday:'short',day:'numeric'}))}</button>`).join('')}
    <button class="link" data-a="skipmiss" data-k2="${L.join(',')}" aria-label="Ignorer ces jours">Ignorer</button></div></div>`;
}

/* ---------- état de l'interface ---------- */
let tab='day', cur=ymd(new Date()), month=new Date(); month.setDate(1);

/* ---------- icônes ---------- */
const I={
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 day:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
 set:'<svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>',
 theme:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>',
 save:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>',
 moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>',
 bolt:'<svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>',
 sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>'
};

/* ---------- thème ---------- */
function applyTheme(){
  const t=db.settings.theme,d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches),r=document.documentElement;
  r.dataset.th=d?'dark':'light';r.dataset.fx='glass';r.dataset.bg='halo';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#080C0D':'#EEE9E1';
}
function isDark(){return document.documentElement.dataset.th==='dark'}
function flipTheme(){db.settings.theme=isDark()?'light':'dark';save();applyTheme();render()}

/* ---------- toast ---------- */
let _ip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();_ip=e});
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}

/* ---------- rendu : jour ---------- */
function ribbonHTML(list){
  const w=list.filter(e=>e.type==='work'||e.type==='pause');
  let lo=360,hi=1080;
  for(const e of w){const s=toMin(e.start);let en=toMin(e.end);if(en<=s)en+=1440;lo=Math.min(lo,Math.floor((s-30)/60)*60);hi=Math.max(hi,Math.ceil((en+30)/60)*60)}
  lo=Math.max(lo,0);hi=Math.min(hi,1800);
  const sp=hi-lo, pc=m=>(m-lo)/sp*100;
  let segs='';
  for(const e of w){const s=toMin(e.start);let en=toMin(e.end);if(en<=s)en+=1440;
    segs+=`<div class="seg ${e.type==='work'?'w':'p'}" style="left:${pc(s)}%;width:${(en-s)/sp*100}%"></div>`}
  const step=sp/60<=12?2:3;let ticks='';
  for(let h=Math.ceil(lo/60);h*60<=hi;h++){if((h-Math.ceil(lo/60))%step===0){const q=pc(h*60);ticks+=`<i style="left:${q}%;${q>94?'transform:translateX(-100%)':q<6?'transform:none':''}">${pad(h%24)}</i>`}}
  return `<div class="ribbon" aria-hidden="true"><div class="rail">${segs}</div><div class="sleepers"></div><div class="ticks">${ticks}</div></div>`;
}
const bigHTML=m=>`<div class="big">${Math.floor(m/60)}<i>h</i>${pad(m%60)}<i>min</i></div>`;
function weekBars(d){
  const wd=(d.getDay()+6)%7,mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd),out=[];let tot=0;
  for(let i=0;i<7;i++){const x=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),k=ymd(x),m=totals(dayEntries(k)).work;tot+=m;out.push({k,m,sel:k===cur,l:'LMMJVSD'[i],x})}
  return {bars:out,tot,wk:isoWeek(mon)};
}
function renderDay(){
  const list=dayEntries(cur),t=totals(list),dd=db.days[cur]||{},closed=!!dd.closed;
  const d=parseYmd(cur),today=ymd(new Date()),dark=isDark();
  const rel=cur===today?"Aujourd'hui":cur===ymd(new Date(Date.now()-864e5))?'Hier':dfmt(d,{year:'numeric'});
  let h=`<div class="top">
    <div class="datebar"><button class="nav" data-a="prev" aria-label="Jour précédent">‹</button>
      <div class="dl"><b>${cap(dfmt(d,{weekday:'long',day:'numeric',month:'long'}))}</b><small>${rel}</small>
        <input type="date" id="pick" value="${cur}" aria-label="Choisir une date" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer"></div>
      <button class="nav" data-a="next" aria-label="Jour suivant">›</button></div>
    <button class="pod" data-a="settings" aria-label="Réglages">${I.set}</button></div>`;
  h+=installHTML();if(!closed)h+=missingHTML();
  const sub=`<div class="sub"><div>Pause <b>${fmt(t.pause)}</b></div>${t.abs?`<div>Absence <b>${fmt(t.abs)}</b></div>`:''}<div>Mandats <b>${Object.keys(t.by).length}</b></div>${t.piq?`<div>Piquet <b>${fmt(t.piq)}</b></div>`:''}</div>`;
  const badge=closed?`<div class="badge">${I.check.replace('<svg','<svg width="18" height="18"')} Journée terminée${dd.forfait?' · forfait':''}</div>`:'';
  if(dark){
    h+=`<div class="hero"><div class="lbl sl">Présence</div>${bigHTML(t.work)}${sub}${badge}</div>`;
    if(list.length)h+=ribbonHTML(list);
  }else{
    const w=weekBars(d),mx=Math.max(540,...w.bars.map(b=>b.m));
    h+=`<div class="herocard"><div class="lbl">Présence du jour</div>${bigHTML(t.work)}${sub}
      <div class="bars">${w.bars.map(b=>`<button class="bar${b.sel?' sel':''}${b.m?'':' ghost'}" data-go="${b.k}" aria-label="${esc(dfmt(b.x,{weekday:'long',day:'numeric'}))}" style="height:${b.m?Math.max(18,Math.round(b.m/mx*92)):10}px">${b.sel&&b.m?`<span class="tip">${fmt(b.m)}</span>`:''}</button>`).join('')}</div>
      <div class="dow">${w.bars.map(b=>`<span>${b.l}</span>`).join('')}</div>
      <div class="herofoot"><span>Semaine ${w.wk}</span><b>${fmt(w.tot)}</b></div></div>${badge}`;
    if(list.length)h+=`<div class="rcard">${ribbonHTML(list)}</div>`;
  }
  if(!list.length){
    const tp=db.settings.tpl;
    h+=`<div class="empty"><b>Rien pour ce jour</b>« Journée type » remplit ${tp.m1}–${tp.m2} et ${tp.a1}–${tp.a2}. « Ajouter » saisit un bloc à la fois.
      <button class="btn line" data-a="copyday">Copier une autre journée</button></div>`;
  }else{
    const rowH=e=>{
      const col=e.type==='work'?'var(--work)':e.type==='pause'?'var(--pause)':e.type==='piquet'?'var(--piq)':'var(--abs)';
      const ic=e.type==='abs'?I.cal:e.type==='pause'?I.pause:e.type==='piquet'?I.bolt:(e.blk&&e.blk.startsWith('nuit'))?I.moon:I.sun;
      const title=e.type==='abs'?e.absType:`${e.start} – ${e.end}`;
      const lab={matin:'Matin',apres:'Après-midi',nuit:'Nuit',nuit2:'Nuit (suite)',pause:'Pause',abs:'Absence',piq:'Piquet',piq2:'Piquet (suite)'}[e.blk]||'';
      const sb=e.type==='abs'||e.type==='pause'?lab:`${lab}${e.mandate?' · '+e.mandate:''}`;
      return `<button class="row" data-edit="${e.id}"><div class="mk" style="--c:${col}">${ic}</div>
        <div class="m"><div class="t">${esc(title)}</div><div class="s">${esc(sb)}</div></div><div class="d">${fmt(dur(e))}</div></button>`;
    };
    const main=list.filter(e=>e.type!=='piquet'),piqs=list.filter(e=>e.type==='piquet');
    if(main.length)h+='<div class="list">'+main.map(rowH).join('')+'</div>';
    if(piqs.length)h+='<h3 class="sec">Piquet</h3><div class="list" style="margin-top:8px">'+piqs.map(rowH).join('')+'</div>';
  }
  if(dd.forfait&&dd.lieu)h+=`<div class="forfait"><b>Forfait journalier</b><span>${esc(dd.lieu)}</span></div>`;
  const last=db.settings.lastBackup,sn=db.settings.backupSnooze||0,stale=db.entries.length>0&&(!last||(Date.now()-last)>7*864e5)&&Date.now()>sn;
  if(stale)h+=`<div class="note col"><span><b>${last?'Ça fait plus d\'une semaine.':'Tes heures ne sont pas encore sauvegardées.'}</b><br><small>Une sauvegarde prend dix secondes.</small></span><div class="chips"><button class="btn primary" data-a="backup" style="min-height:48px;padding:0 20px">Sauvegarder mes heures</button><button class="link" data-a="bsnooze">Plus tard</button></div></div>`;
  $('#app').innerHTML=h;
  $('#pick').onchange=e=>{if(e.target.value){cur=e.target.value;render()}};
  $('#actions').innerHTML=closed
    ?`<button class="btn second wide" data-a="reopen">Rouvrir la journée</button>`
    :`<button class="btn primary" data-a="add">${I.plus} Ajouter</button>
      ${list.length?`<button class="btn second" data-a="finish">${I.check} Terminer</button>`:`<button class="btn second" data-a="tpl">Journée type</button>`}`;
}

/* ---------- rendu : mois ---------- */
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)}
function renderMonth(){
  const y=month.getFullYear(),mo=month.getMonth(),first=new Date(y,mo,1),n=new Date(y,mo+1,0).getDate();
  const lead=(first.getDay()+6)%7;
  let work=0,days=0,forf=0,piq=0;const per={};
  for(let i=1;i<=n;i++){const k=ymd(new Date(y,mo,i));const t=totals(dayEntries(k));
    per[k]=t;work+=t.work;piq+=t.piq;if(t.work>0)days++;if((db.days[k]||{}).forfait)forf++}
  const todayK=ymd(new Date());
  const hm=m=>`${Math.floor(m/60)}<span>h</span>${pad(m%60)}`;
  const bars=Array.from({length:n},(_,i)=>{const k=ymd(new Date(y,mo,i+1)),w=per[k].work;
    return `<i class="${w?'':'z'} ${k===todayK?'today':''}" style="--h:${w?Math.max(10,Math.min(100,w/600*100)):4}%;--d:${i}"></i>`}).join('');
  let c=0;const I2=()=>`style="--i:${c++}"`;
  let h=`<div class="mhead"><button class="nav" data-a="mprev" aria-label="Mois précédent">‹</button>
    <h1>${cap(dfmt(first,{month:'long',year:'numeric'}))}</h1><button class="nav" data-a="mnext" aria-label="Mois suivant">›</button></div>
    <div class="bento">
    <section class="bn hero w2" ${I2()}><div class="k"><i></i>Heures de présence</div>
      <div class="num">${hm(work)}<span>min</span></div>
      <div class="spark" aria-hidden="true">${bars}</div><div class="sparkl" aria-hidden="true"><span>1</span><span>${n}</span></div></section>
    <section class="bn" ${I2()}><div class="k"><i></i>Jours travaillés</div><div class="num">${days}</div></section>
    <section class="bn" ${I2()}><div class="k"><i></i>Forfaits</div><div class="num">${forf}</div><div class="sub2">${forf?'repas de midi':'aucun'}</div></section>`;
  if(piq)h+=`<section class="bn piq w2 row2" ${I2()}><div class="k"><i></i>Piquet</div><div class="num">${fmt(piq)}</div></section>`;
  h+=`<section class="bn w2" ${I2()}><div class="k"><i></i>Calendrier</div><div class="cal">${['L','M','M','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')}`;
  for(let i=0;i<lead;i++)h+='<div class="cell o"></div>';
  for(let i=1;i<=n;i++){const k=ymd(new Date(y,mo,i)),t=per[k],we=((lead+i-1)%7)>4;
    const has=t.work>0||t.abs>0||t.piq>0,p=t.work?Math.round(12+Math.min(t.work/540,1)*26):16;
    h+=`<button class="cell ${has?'has':''} ${k===todayK?'today':''} ${we?'we':''} ${isMissing(k)?'miss':''}" style="--p:${p}%" data-go="${k}">
      ${(db.days[k]||{}).closed?I.check.replace('<svg','<svg class="tick"'):''}${i}<small>${t.work?fmt(t.work).replace(' h ',':'):(t.abs?'abs.':(t.piq?'piq.':''))}</small></button>`;
  }
  h+='</div></section>';
  const wk={};
  for(let i=1;i<=n;i++){const d=new Date(y,mo,i);const w=isoWeek(d);wk[w]=wk[w]||{w:0,a:0,f:i,l:i};wk[w].w+=per[ymd(d)].work;wk[w].a+=per[ymd(d)].abs;wk[w].l=i}
  const wmx=Math.max(1,...Object.values(wk).map(o=>o.w));
  h+=`<section class="bn w2" ${I2()}><div class="k"><i></i>Semaines</div><div style="margin-top:6px">`+
    Object.keys(wk).map((w,i)=>{const o=wk[w];
      return `<div class="week2"><div><b>Sem. ${w}</b><small>${o.f}–${o.l} ${dfmt(first,{month:'short'})}</small></div><div class="bar"><i style="--w:${Math.max(3,o.w/wmx*100)}%;--d:${i}"></i></div><em>${fmt(o.w)}</em></div>`}).join('')+`</div></section></div>`;
  h+=`<button class="btn line" data-a="recap" style="width:100%;margin-top:14px">Récapitulatif du mois</button>`;
  $('#app').innerHTML=h;$('#actions').innerHTML='';
}

/* ---------- rendu : réglages ---------- */
function renderSettings(){
  const s=db.settings,last=s.lastBackup?dfmt(new Date(s.lastBackup),{day:'numeric',month:'long',year:'numeric'}):'jamais';
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const pf=s.profile;
  $('#app').innerHTML=`<div class="mhead"><h1>Réglages</h1></div>
  <div class="card"><h4>Profil</h4><p>Reste sur cet appareil, inclus dans ta copie de sauvegarde.</p>
    <label class="f" style="margin-top:0">Prénom</label><input class="txt" data-pf="prenom" autocomplete="given-name" value="${esc(pf.prenom)}">
    <label class="f">Nom</label><input class="txt" data-pf="nom" autocomplete="family-name" value="${esc(pf.nom)}">
    <label class="f">Division</label><input class="txt" data-pf="division" autocomplete="off" value="${esc(pf.division)}"></div>
  <div class="card"><h4>Apparence</h4><div class="seg3" style="margin-top:10px">

/* ---------- saisie de la journée : blocs indépendants, un seul Enregistrer ---------- */
const TABS=[['matin','Matin'],['apres','Après-midi'],['nuit','Nuit'],['pause','Pause'],['abs','Absence'],['piq','Piquets']];
const TLAB={matin:'Matin',apres:'Après-midi',nuit:'Nuit',pause:'Pause',abs:'Absence',piq:'Piquet'};
const SEGS=['matin','apres','nuit','piq'];
const TABOF={matin:'matin',apres:'apres',nuit:'nuit',nuit2:'nuit',pause:'pause',abs:'abs',piq:'piq',piq2:'piq'};
let D=null;
const filled=s=>!!(s.end||s.mandate||(s.start&&!s.pre));
const isDone=s=>!!(s.start&&s.end);
function openDay(date,tab,opt){
  opt=opt||{};const srcD=opt.copy||date;
  const es=db.entries.filter(e=>e.date===srcD&&e.blk!=='nuit2'&&e.blk!=='piq2').sort((a,b)=>toMin(a.start||'23:59')-toMin(b.start||'23:59'));
  const dd0=db.days[srcD]||{};
  D={forfait:!!dd0.forfait,lieu:dd0.lieu||'',date,tab:tab||'matin',segs:{matin:[],apres:[],nuit:[],piq:[]},pause:{start:'',end:'',manual:false},abs:{absType:'',dur:0},had:hasDay(date)};
  for(const e of es){
    if(SEGS.includes(e.blk)){
      const s={start:e.start,end:e.end,mandate:e.mandate||'',pre:false};
      const h=e.pair&&db.entries.find(x=>x.pair===e.pair&&(x.blk==='nuit2'||x.blk==='piq2'));
      if(h)s.end=h.end;
      D.segs[e.blk].push(s);
    }else if(e.blk==='pause')D.pause={start:e.start,end:e.end,manual:true};
    else if(e.blk==='abs')D.abs={absType:e.absType,dur:e.dur};
  }
  if(!tab){D.tab=!D.segs.matin.length?'matin':!D.segs.apres.length?'apres':'pause'}

  let note='';
  if(opt.tpl){tplFill();D.tab='matin';const m=lastMandate();note=m?`Journée type, mandat repris : ${m}. Vérifie, puis enregistre.`:'Journée type : indique le mandat, puis enregistre.'}
  if(opt.copy){D.tab='matin';note=`Copie du ${dfmt(parseYmd(opt.copy),{weekday:'long',day:'numeric',month:'long'})}. Vérifie, puis enregistre.`}
  autoPause();

    ${note?`<p style="margin:0 20px 8px;color:var(--muted);font-size:14px;line-height:1.4">${esc(note)}</p>`:''}
    <div class="stabs" id="stabs" role="tablist"></div>
    <div class="sbody" id="panel"></div>
    <div class="sfoot">${D.had?'<button class="btn quiet del" data-a="delday" style="flex:none;height:60px" aria-label="Vider la journée">Vider</button>':''}
    <button class="btn second" data-a="close">Annuler</button><button class="btn primary" id="saveE" data-a="saveentry">Enregistrer</button></div>`,drawDay);
}
function tplFill(){
  const t=db.settings.tpl,m=lastMandate();
  D.segs.matin=[{start:t.m1,end:t.m2,mandate:m,pre:false}];
  D.segs.apres=[{start:t.a1,end:t.a2,mandate:m,pre:false}];
  D.pause={start:'',end:'',manual:false};autoPause();
}
function hasContent(b){
  if(SEGS.includes(b))return D.segs[b].some(isDone);
  if(b==='pause')return !!(D.pause.start&&D.pause.end)||D.forfait;
  return !!(D.abs.absType&&D.abs.dur);
}
function autoPause(){
  if(D.pause.manual)return;
  const m=D.segs.matin.filter(isDone),a=D.segs.apres.filter(isDone);
  if(m.length&&a.length){
    const s=Math.max(...m.map(x=>toMin(x.end))),e=Math.min(...a.map(x=>toMin(x.start)));
    if(e>s){D.pause.start=toHHMM(s);D.pause.end=toHHMM(e);return}
  }
  D.pause.start='';D.pause.end='';
}
function drawDay(){
  $('#stabs').innerHTML=TABS.map(([k,l])=>`<button class="stab k-${k==='pause'?'pause':k==='abs'?'abs':k==='piq'?'piq':'work'}" role="tab" data-dt="${k}" aria-selected="${D.tab===k}">${l}${hasContent(k)?'<i class="dot"></i>':''}</button>`).join('');
  drawPanel();
  const on=$('#stabs [aria-selected=true]');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
}
const tile=(lab,v,key)=>`<button class="tile ${v?'':'empty'}" data-t="${key}"><span>${lab}</span><b>${v||'--:--'}</b></button>`;
function segCard(b,i){
  const s=D.segs[b][i],n=D.segs[b].length;
  const split=(b==='nuit'||b==='piq')&&s.start&&s.end&&toMin(s.end)<toMin(s.start)&&s.end!=='00:00';
  let h=`<div class="plage"><div class="ph"><b>${TLAB[b]}${n>1?' '+(i+1):''}</b>${n>1||filled(s)?`<button class="link rm" data-rm="${b}:${i}">${n>1?'Retirer':'Effacer'}</button>`:''}</div>
    <div class="times">${tile('Début',s.start,`seg:${b}:${i}:start`)}${tile('Fin',s.end,`seg:${b}:${i}:end`)}</div>
    <div class="chips"><button class="chip" data-now="${b}:${i}">Fin : maintenant</button></div>`;
  if(split)h+=`<div class="hint ok2">Coupée à minuit : ${s.start} – 00:00 ce jour, 00:00 – ${s.end} le lendemain.</div>`;
  if(b==='piq'){
    h+=`<label class="f">Mandat (facultatif)</label><input class="txt" data-mi="${b}:${i}" autocomplete="off" placeholder="Numéro de mandat" value="${esc(s.mandate)}">`;
  }else{
    const r=recents('mandate'),all=['Non productif',...r];
    h+=`<label class="f">Mandat</label><div class="chips">${all.map(m=>`<button class="chip" data-m="${b}:${i}" data-v="${esc(m)}" aria-pressed="${s.mandate===m}">${esc(m)}</button>`).join('')}</div>
      <input class="txt" data-mi="${b}:${i}" autocomplete="off" placeholder="Numéro de mandat" value="${s.mandate&&!all.includes(s.mandate)?esc(s.mandate):''}">`;
  }
  return h+'</div>';
}
function drawPanel(){
  const t=D.tab;let h='';
  if(SEGS.includes(t)){
    h=((t==='matin'||t==='apres')&&!D.segs.matin.some(isDone)&&!D.segs.apres.some(isDone)?`<div class="chips" style="margin:2px 0 4px"><button class="chip" data-a="tplfill">Remplir avec la journée type</button></div>`:'')+D.segs[t].map((_,i)=>segCard(t,i)).join('');
    h+=`<button class="btn line addseg" data-addseg="${t}">+ ${t==='piq'?'Autre intervention':'Autre mandat'}</button>`;
  }else if(t==='pause'){
    const p=D.pause;
    h=`<div class="plage"><div class="ph"><b>Pause</b></div><div class="times">${tile('Début',p.start,'pause:start')}${tile('Fin',p.end,'pause:end')}</div>
      <div class="chips">${[30,45,60].map(m=>`<button class="chip pause" data-pd="${m}">${m===60?'1 h':m+' min'}</button>`).join('')}</div>
      <div class="hint ok2">${p.manual?'Réglée à la main.':'Calculée entre le matin et l\'après-midi, modifiable.'}</div>
      ${p.manual?'<button class="btn line" data-a="autopause">Recalculer automatiquement</button>':''}
      ${(p.start||p.end)?'<button class="link rm" data-a="nopause" style="margin-top:6px">Pas de pause</button>':''}</div>
      <button class="switch" role="switch" aria-checked="${D.forfait}" data-a="toggleforfait" style="margin-top:14px"><span><b>Forfait journalier</b><small>Repas de midi, avec lieu de travail</small></span><i class="sw"></i></button>`;
    if(D.forfait){const r=recents('lieu');
      h+=`<div class="plage"><label class="f" style="margin-top:0">Lieu de travail</label>${r.length?`<div class="chips">${r.map(l=>`<button class="chip" data-l="${esc(l)}" aria-pressed="${D.lieu===l}">${esc(l)}</button>`).join('')}</div>`:''}
        <input class="txt" id="fl" autocomplete="off" placeholder="Où as-tu travaillé ?" value="${esc(D.lieu)}"></div>`;}
  }else{
    const a=D.abs,half=Math.round(db.settings.fullDay/2);
    h=`<div class="plage"><div class="ph"><b>Absence</b>${(a.absType||a.dur)?'<button class="link rm" data-a="noabs">Effacer</button>':''}</div>
      <label class="f" style="margin-top:6px">Type</label><div class="chips">${ABS.map(x=>`<button class="chip abs" data-abs="${x}" aria-pressed="${a.absType===x}">${x}</button>`).join('')}</div>
      <label class="f">Durée</label><div class="chips">
      <button class="chip abs" data-d="${db.settings.fullDay}" aria-pressed="${a.dur===db.settings.fullDay}">Journée entière</button>
      <button class="chip abs" data-d="${half}" aria-pressed="${a.dur===half}">Demi-journée</button></div>
      <div class="times">${tile('Durée précise',a.dur?toHHMM(a.dur):'','abs:dur')}</div></div>`;
  }
  h+='<div class="hint" id="hint"></div>';
  $('#panel').innerHTML=h;
  validateDay();
}
const ivl=(s,e,cut)=>{s=toMin(s);e=toMin(e);return [s,e<=s?(cut?1440:e+1440):e]};
function collect(){
  const recs=[],iv=[];let err='';const d=D.date;
  const nextD=()=>{const x=parseYmd(d);x.setDate(x.getDate()+1);return ymd(x)};
  for(const b of SEGS){
    D.segs[b].forEach((s,i)=>{
      if(!filled(s))return;
      const nm=TLAB[b]+(D.segs[b].length>1?' '+(i+1):'');
      if(!err&&(!s.start||!s.end))err=`${nm} : il manque ${!s.start?'le début':'la fin'}.`;
      else if(!err&&s.start===s.end)err=`${nm} : début et fin identiques.`;
      else if(!err&&b!=='piq'&&!s.mandate.trim())err=`${nm} : indique le mandat ou « Non productif ».`;
      else if(!err&&(b==='matin'||b==='apres')&&toMin(s.end)<toMin(s.start))err=`${nm} : la fin est avant le début. Pour une fin après minuit, utilise Nuit.`;
      if(err||!s.start||!s.end)return;
      const type=b==='piq'?'piquet':'work',base={date:d,type,blk:b,mandate:s.mandate.trim()};
      const a=toMin(s.start),e=toMin(s.end);
      if((b==='nuit'||b==='piq')&&e<a&&e>0){
        const pair=uid(),n=nextD();
        recs.push({...base,id:uid(),start:s.start,end:'00:00',pair});
        recs.push({...base,id:uid(),date:n,blk:b==='nuit'?'nuit2':'piq2',src:d,start:'00:00',end:s.end,pair});
        if(b!=='piq')iv.push([nm,a,1440])
      }else{
        recs.push({...base,id:uid(),start:s.start,end:s.end});
        if(b!=='piq'){const [x,y]=ivl(s.start,s.end,true);iv.push([nm,x,y])}
      }
    });
  }
  if(!err&&D.forfait&&!D.lieu.trim())err='Forfait : indique le lieu de travail.';
  const p=D.pause;
  if(!err&&(p.start||p.end)){
    if(!p.start||!p.end)err=`Pause : il manque ${!p.start?'le début':'la fin'}.`;
    else if(toMin(p.end)<=toMin(p.start))err='Pause : la fin doit être après le début.';
    else{recs.push({id:uid(),date:d,type:'pause',blk:'pause',start:p.start,end:p.end});iv.push(['Pause',toMin(p.start),toMin(p.end)])}
  }
  const a=D.abs;
  if(!err&&(a.absType||a.dur)){
    if(!a.absType)err='Absence : choisis le type.';
    else if(!a.dur)err='Absence : indique la durée.';
    else recs.push({id:uid(),date:d,type:'abs',blk:'abs',absType:a.absType,dur:a.dur});
  }
  if(!err)for(let i=0;i<iv.length&&!err;i++)for(let j=i+1;j<iv.length;j++)
    if(iv[i][1]<iv[j][2]&&iv[j][1]<iv[i][2]){err=`${iv[i][0]} et ${iv[j][0]} se chevauchent.`;break}
  return {recs,err};
}
function validateDay(){
  const {recs,err}=collect();
  const b=$('#saveE');if(b)b.disabled=!!err||!recs.length;
  const h=$('#hint');if(h)h.textContent=err;
}
function saveDay(){
  const {recs,err}=collect();if(err||!recs.length)return;
  const d=D.date;
  db.entries=db.entries.filter(e=>!(e.date===d&&e.blk!=='nuit2'&&e.blk!=='piq2')&&!(e.src===d));
  db.entries.push(...recs);
  db.days[d]=Object.assign(db.days[d]||{},{forfait:D.forfait,lieu:D.forfait?D.lieu.trim():''});
  save();closeSheet();render();toast('Enregistré');
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(navigator.vibrate)navigator.vibrate(12);
}
function segPad(b,i,f){
  const s=D.segs[b][i];
  openPad(f==='start'?'Début':'Fin',s[f],v=>{
    s[f]=v;s.pre=false;
    if(f==='end'&&!s.start){}
    autoPause();drawDay();
  });
}
function tileTap(k){
  const p=k.split(':');
  if(p[0]==='seg')segPad(p[1],+p[2],p[3]);
  else if(p[0]==='pause')openPad(p[1]==='start'?'Début de pause':'Fin de pause',D.pause[p[1]],v=>{D.pause[p[1]]=v;D.pause.manual=true;drawDay()});
  else if(p[0]==='abs')openPad('Durée',D.abs.dur?toHHMM(D.abs.dur):'',v=>{D.abs.dur=toMin(v);drawDay()});
  else if(p[0]==='tpl'){const L={m1:'Matin : début',m2:'Matin : fin',a1:'Après-midi : début',a2:'Après-midi : fin'};
    openPad(L[p[1]],db.settings.tpl[p[1]],v=>{db.settings.tpl[p[1]]=v;save();render();toast('Enregistré')})}
  else if(k==='fullday')openPad('Journée entière',toHHMM(db.settings.fullDay),v=>{db.settings.fullDay=toMin(v);save();render();toast('Enregistré')});
}

/* terminer la journée */

/* copier une journée */
function openCopy(){
  const all=[...new Set(db.entries.filter(e=>e.blk!=='nuit2'&&e.blk!=='piq2'&&e.date!==cur).map(e=>e.date))].sort().reverse();
  const before=all.filter(k=>k<cur),L=(before.length?before:all).slice(0,5);

  openSheet(`<h2>Copier une journée</h2><div class="sbody"><p style="color:var(--muted);margin:0 0 12px;line-height:1.45">Les plages, mandats, forfait et lieu sont repris dans la journée affichée. Tu vérifies avant d'enregistrer.</p>
